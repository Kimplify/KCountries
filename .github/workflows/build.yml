name: CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Test All Platforms
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run JVM tests
        run: ./gradlew :countries-core:jvmTest :countries-i18n:jvmTest

      - name: Run iOS tests
        run: ./gradlew :countries-core:iosSimulatorArm64Test :countries-i18n:iosSimulatorArm64Test

      - name: Run JS tests
        run: ./gradlew :countries-core:jsTest :countries-i18n:jsTest

      - name: Run WasmJs tests
        run: ./gradlew :countries-core:wasmJsTest :countries-i18n:wasmJsTest

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: |
            countries-core/build/reports/tests/
            countries-core/build/test-results/
            countries-i18n/build/reports/tests/
            countries-i18n/build/test-results/
          retention-days: 30

  build:
    name: Build Library
    needs: test
    runs-on: macOS-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build library
        run: ./gradlew :countries-core:build :countries-i18n:build
